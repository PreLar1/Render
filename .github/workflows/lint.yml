name: Lint and Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
      - name: Debug repository contents
        run: |
          echo "Current directory: $(pwd)"
          ls -laR
          find . -type f
          if [ -f ./railway.yml ]; then
            echo "railway.yml found"
          else
            echo "railway.yml not found, searching case-insensitive..."
            find . -type f -iname "railway.yml"
            echo "Checking for hidden characters..."
            find . -type f -exec file {} \;
          fi
      - name: Install yamllint
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint
      - name: Lint YAML
        run: |
          if [ -f ./railway.yml ]; then
            yamllint ./railway.yml
          else
            echo "Error: railway.yml not found"
            exit 1
          fi
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Lint Shell Script
        uses: reviewdog/action-shellcheck@v1.18.0
        with:
          path: start.sh